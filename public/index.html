<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spotify Random Album</title>
    <!-- Icon: Twemoji 1f3b6 (c) Twitter, Inc and contributors, CC-BY 4.0 -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="fonts/400.css">
    <link rel="stylesheet" href="fonts/700.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Spotify Random Album</h1>
    <div id="controls">
      <button type="button" id="login" hidden>Log in with Spotify</button>
      <button type="button" id="reroll" hidden>Pick 5 more</button>
      <button type="button" id="refresh" hidden>Refresh albums</button>
      <button type="button" id="logout" hidden>Switch Spotify account</button>
    </div>
    <p id="status"></p>
    <ul id="albums"></ul>
    <script type="module" src="main.js"></script>
  </body>
</html>
